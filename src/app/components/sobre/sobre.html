<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="text-primary fw-bold">🌱 Sobre o Infocycle</h2>
    <p class="text-muted fs-5">Tecnologia sustentável e economia circular para o seu setup e para o planeta.</p>
  </div>

  <div class="row g-4 mb-5">
    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-success p-4">
        <h4 class="text-success mb-3">🎯 Nossa Missão</h4>
        <p class="text-muted m-0">{{ missao }}</p>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-primary p-4">
        <h4 class="text-primary mb-3">👁️ Nossa Visão</h4>
        <p class="text-muted m-0">{{ visao }}</p>
      </div>
    </div>
  </div>

  <div class="card shadow-sm p-4 bg-light">
    <h4 class="text-dark mb-3 text-center">💎 Nossos Valores</h4>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
      @for (valor of valores; track valor) {
        <div class="col">
          <div class="p-3 bg-white rounded shadow-sm text-center border border-success h-100 d-flex align-items-center justify-content-center">
            <span class="fw-bold text-success">{{ valor }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
