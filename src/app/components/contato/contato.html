<div class="container my-5">
  <h2 class="mb-4 text-primary">📞 Fale Conosco - Infocycle</h2>
  <p class="text-muted">Dúvidas sobre equipamentos recertificados ou logística reversa? Envie sua mensagem.</p>

  @if (enviado()) {
    <div class="alert alert-success" role="alert">
      Mensagem enviada com sucesso! A equipe do Infocycle entrará em contacto em breve.
    </div>
  } @else {
    <form (submit)="enviarMensagem($event)" class="card shadow-sm p-4">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control" [ngModel]="nome()" (ngModelChange)="nome.set($event)" name="nome" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required>
      </div>

      <div class="mb-3">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea id="mensagem" class="form-control" rows="4" [ngModel]="mensagem()" (ngModelChange)="mensagem.set($event)" name="mensagem" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Enviar Mensagem</button>
    </form>
  }
</div>
