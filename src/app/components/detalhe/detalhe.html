<div class="container my-5">
  <div class="row g-4 align-items-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-3">
        <img [src]="obj.codigo + '.jpg'" class="card-img-top w-100 rounded" [alt]="obj.nome">
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 h-100">
        <h3 class="card-title text-primary fw-bold mb-3">{{ obj.nome }}</h3>
        <p class="text-muted">{{ obj.descritivo }}</p>
        
        <div class="card-body px-0">
          @if (obj.valorPromo && obj.valorPromo > 0) {
            <div class="mb-4">
              <span class="text-muted text-decoration-through d-block">de: {{ obj.valor | currency:'BRL' }}</span>
              <span class="text-success fw-bold fs-3">por: {{ obj.valorPromo | currency:'BRL' }}</span>
            </div>
          } @else {
            <div class="mb-4">
              <span class="text-success fw-bold fs-3">por: {{ obj.valor | currency:'BRL' }}</span>
            </div>
          }

          <button class="btn btn-success w-100 py-2 fw-bold" (click)="adicionarCesta()">
            🛒 Adicionar à Cesta
          </button>
        </div>    
      </div>
    </div>
  </div>
</div>
